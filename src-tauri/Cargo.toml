[package]
name = "lumen-hid"
version = "1.0.0"
description = "LumenHID — Minimalist Multi-Protocol Peripheral Driver (2.4G / Bluetooth / USB)"
authors = ["LumenHID Engineering"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lumen_hid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
