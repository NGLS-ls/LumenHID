[package]
name = "lumen-hid"
version = "1.0.0"
description = "LumenHID — Minimalist Multi-Protocol Peripheral Driver (2.4G / Bluetooth / USB)"
authors = ["LumenHID Engineering"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lumen_hid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2.6"
prost = "0.13"
h2 = "0.4"
http = "1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
